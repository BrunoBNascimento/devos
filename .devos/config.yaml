version: 3.0
framework: "DevOS - Agentic Workflow"

workspace:
  repo_directories: ["./"] # Directories for dynamic discovery
  ignore_patterns_file: ".devos/.devosignore"

knowledge_system:
  router_enabled: true

  knowledge_bases:
    github:
      priority: 1.0
      path: ".devos/memory/brain_kb/"
      description: "Repository-level knowledge extracted from GitHub issues, PRs, and discussions."

    jira:
      priority: 0.9
      path: ".devos/memory/brain_kb/"
      description: "Project management context from Jira tickets, epics, and sprint retrospectives."

    business_rules:
      priority: 1.2
      path: ".devos/memory/brain_kb/"
      description: "Domain-specific business rules, regulatory constraints, and invariants that must never be violated."

    kb_name_1:
      priority: 0.4
      path: ".devos/memory/brain_kb/"
      description: "Low-priority supplemental knowledge base. Rename and configure as needed."

  fusion:
    algorithm: weighted_rrf # Weighted Reciprocal Rank Fusion — merges results across KBs respecting priority weights

  reranker:
    model: bge-reranker-large # Cross-encoder reranker applied after fusion to refine final ordering

  retrieval:
    top_k_per_kb: 15 # Maximum chunks retrieved per knowledge base before fusion

  context:
    final_chunks: 12 # Maximum chunks injected into the working context after fusion + reranking

# ---------------------------------------------------------------------------
# INTEGRATIONS — External data sources for context ingestion (start_workflow)
# ---------------------------------------------------------------------------
integrations:

  jira:
    enabled: true
    auth: "MCP"                          # Auth method: MCP (via mcps.json), ENV, or TOKEN
    base_url: "https://YOUR_ORG.atlassian.net"
    default_project: "PROJ"              # Default project key when not specified by user
    boards:                              # Boards to scan for context during /devos.start
      - id: "BOARD_ID_1"
        name: "Sprint Board"
        type: "scrum"
      - id: "BOARD_ID_2"
        name: "Kanban Ops"
        type: "kanban"
    filters:
      status: ["To Do", "In Progress", "In Review"]  # Only pull tickets in these statuses
      labels: []                                       # Optional: filter by labels (empty = all)
      assignee: "current_user"                         # "current_user", "unassigned", or specific ID
    lookback_days: 14                    # How far back to look for relevant tickets
    include_comments: true               # Pull ticket comments for additional context
    include_attachments: false           # Parse attached files (PDFs, images) — requires MCP support
    max_tickets: 25                      # Max tickets to retrieve per query

  slack:
    enabled: true
    auth: "MCP"
    channels:                            # Channels to monitor for context
      - id: "C_CHANNEL_ID_1"
        name: "#engineering"
        purpose: "Technical discussions, architecture decisions, incident threads"
      - id: "C_CHANNEL_ID_2"
        name: "#product"
        purpose: "Feature requests, PRD discussions, stakeholder feedback"
      - id: "C_CHANNEL_ID_3"
        name: "#alerts"
        purpose: "Production alerts, error spikes, monitoring notifications"
    lookback_days: 7                     # How far back to scan messages
    thread_depth: "full"                 # "full" (all replies), "top_only" (parent messages only), or integer (max replies)
    include_reactions: false             # Track emoji reactions as signal of importance
    include_files: false                 # Parse shared files in messages
    max_messages_per_channel: 100        # Max messages to retrieve per channel

  meeting_notes:
    enabled: true
    auth: "MCP"
    providers:                           # Transcription/note sources
      - name: "otter_ai"
        enabled: false
      - name: "google_meet"
        enabled: true
      - name: "manual"                   # User drops .md files in a directory
        enabled: true
        watch_path: ".devos/memory/transcripts/"  # Directory for manually placed transcripts
    lookback_days: 30                    # How far back to search for meeting transcripts
    filters:
      keywords: []                       # Optional: only pull transcripts containing these keywords
      participants: []                   # Optional: filter by participant names
    max_transcripts: 10                  # Max transcripts to retrieve per query

  github:
    enabled: true
    auth: "MCP"
    repositories:                        # Repos to scan for issues, PRs, and discussions
      - owner: "YOUR_ORG"
        repo: "YOUR_REPO"
    sources:
      issues: true                       # Scan open/recent issues
      pull_requests: true                # Scan open/recent PRs and their review comments
      discussions: true                  # Scan GitHub Discussions
    lookback_days: 14                    # How far back to scan
    max_items_per_source: 20             # Max items per source type (issues, PRs, discussions)

# ---------------------------------------------------------------------------
# GIT — Branch, commit, and version control conventions
# ---------------------------------------------------------------------------
git:
  base_branch: "main"                    # Target branch for PRs
  branch_naming: "devos/<type>/<jira_key>-<short_slug>"  # Template for new branches
  # Available tokens: <type>, <jira_key>, <short_slug>, <date>
  # Example output: devos/feature/PROJ-123-user-auth
  commit_format: "conventional"          # "conventional" (feat:, fix:, etc.), "angular", or "freeform"
  commit_scope_from: "jira_key"          # Auto-extract commit scope from Jira ticket key
  auto_stage: true                       # Automatically stage changes after each task
  sign_commits: false                    # GPG sign commits

# ---------------------------------------------------------------------------
# VERIFICATION — Build, lint, test, and instrumentation checks
# ---------------------------------------------------------------------------
verification:
  max_loop_iterations: 5                 # Max fix-verify cycles before escalating to human

  build:
    enabled: true
    command: "npm run build"             # Build command — adapt to your stack
    timeout_seconds: 120
    max_retries: 2                       # Retries on build failure before entering fix cycle

  lint:
    enabled: true
    command: "npm run lint"
    auto_fix: true                       # Attempt auto-fix before reporting errors
    auto_fix_command: "npm run lint:fix"
    fail_on_warnings: false              # Treat lint warnings as errors

  tests:
    enabled: true
    command: "npm run test"
    coverage:
      enabled: true
      command: "npm run test:coverage"
      threshold: 80                      # Minimum coverage % to pass
      fail_below_threshold: true
    timeout_seconds: 300
    must_pass: true                      # All tests must pass to proceed

  type_check:
    enabled: false                       # Enable for TypeScript / typed languages
    command: "npx tsc --noEmit"

  documentation:
    enabled: true
    auto_update: true                    # Automatically update docs based on code changes
    files:                               # Project documentation files to verify and update
      - path: "README.md"
        rule: "Ensure README reflects any new features, changed APIs, or updated setup instructions."
      - path: "CLAUDE.md"
        rule: "Update project-level AI instructions if new modules, conventions, or gotchas were introduced."
      - path: "docs/agents.md"
        rule: "If new agent personas or workflows were added, document them here."
      - path: "CHANGELOG.md"
        rule: "Append a new entry following Keep a Changelog format for all user-facing changes."
      - path: "API.md"
        rule: "If API endpoints were added or modified, update the API documentation."
    commit_message: "docs(<scope>): update documentation to reflect recent changes"

  instrumentation:
    enabled: true
    checks:
      - name: "logging"
        rule: "All new public functions and API endpoints must include structured logging (entry, exit, error)."
      - name: "error_handling"
        rule: "All async operations must have explicit error handling. No unhandled promise rejections. Errors must be logged with context before propagating."
      - name: "metrics"
        rule: "Key business operations must emit counters or histograms. Verify metric names follow naming conventions."
      - name: "tracing"
        rule: "Distributed tracing spans must be propagated across service boundaries. New spans for significant operations."
      - name: "security"
        rule: "No secrets in code. No SQL concatenation. Inputs validated at boundary. Auth checks on protected endpoints."

# ---------------------------------------------------------------------------
# PULL REQUEST — Auto-creation and formatting
# ---------------------------------------------------------------------------
pull_request:
  auto_create: true
  strategy: auto                         # "auto" (detect best method), "gh_cli", "mcp_github", "mcp_gitlab", "local_compare"
  # Strategy resolution order for "auto":
  #   1. Check if MCP GitHub/GitLab server is configured and enabled in mcps.json -> use MCP API
  #   2. Check if `gh` CLI is installed and authenticated -> use `gh pr create`
  #   3. Check if `glab` CLI is installed -> use `glab mr create`
  #   4. Fallback: push branch, output compare URL for user to open manually
  #      GitHub:  https://github.com/<owner>/<repo>/compare/<base>...<branch>
  #      GitLab:  https://gitlab.com/<owner>/<repo>/-/merge_requests/new?source_branch=<branch>
  draft: false
  base_branch: "main"
  title_template: "[<jira_key>] <title>"
  body_sections:
    - "summary"
    - "changes_made"
    - "implementation_plan"
    - "testing_done"
    - "instrumentation_checklist"
    - "documentation_updates"
    - "knowledge_brief_excerpt"
    - "jira_link"
  reviewers: []
  team_reviewers: []
  labels: ["devos-generated"]
  link_jira: true
  jira_transition_on_pr: "In Review"

paths:
  prompts: ".devos/system_prompts/"
  workflows: ".devos/workflows/"
  state: ".devos/memory/state/"
